<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>K-푸드 대표 야식 월드컵 16강 — AI 이상형 월드컵</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;600;700;800;900&family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #070a12;
      --bg-card: rgba(18, 26, 43, 0.85);
      --border-card: rgba(255, 255, 255, 0.12);
      --accent-violet: #8b5cf6;
      --accent-cyan: #06b6d4;
      --accent-gold: #f59e0b;
      --accent-pink: #ec4899;
      --accent-neon: #10b981;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: #070a12;
      background-image: 
        radial-gradient(at 0% 0%, rgba(139, 92, 246, 0.25) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(6, 182, 212, 0.2) 0px, transparent 50%),
        radial-gradient(at 50% 50%, rgba(15, 23, 42, 0.8) 0px, transparent 100%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* Top Nav */
    header {
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-card);
      background: rgba(7, 10, 18, 0.8);
      backdrop-filter: blur(16px);
      z-index: 50;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-weight: 900;
      font-size: 1.25rem;
      font-family: 'Outfit', sans-serif;
      letter-spacing: -0.5px;
    }

    .brand-badge {
      background: linear-gradient(135deg, var(--accent-violet), var(--accent-cyan));
      padding: 0.25rem 0.6rem;
      border-radius: 8px;
      font-size: 0.9rem;
      color: #fff;
    }

    .header-btns {
      display: flex;
      gap: 0.75rem;
    }

    .btn-header {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border-card);
      color: var(--text-main);
      padding: 0.5rem 1rem;
      border-radius: 50px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }

    .btn-header:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: var(--accent-cyan);
    }

    /* Screen Views */
    .view-screen {
      display: none;
      flex: 1;
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
      animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .view-screen.active {
      display: flex;
      flex-direction: column;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ----------------------------------------------------
       1. START SCREEN
    ---------------------------------------------------- */
    .start-container {
      text-align: center;
      margin: auto;
      max-width: 750px;
      padding: 3rem 1.5rem;
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: 32px;
      backdrop-filter: blur(20px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      position: relative;
      overflow: hidden;
    }

    .start-container::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(139, 92, 246, 0.15) 0%, transparent 60%);
      pointer-events: none;
    }

    .start-tag {
      display: inline-block;
      padding: 0.4rem 1.2rem;
      background: rgba(139, 92, 246, 0.15);
      border: 1px solid rgba(139, 92, 246, 0.3);
      color: #c084fc;
      border-radius: 50px;
      font-size: 0.9rem;
      font-weight: 700;
      margin-bottom: 1.5rem;
    }

    .start-title {
      font-size: 2.8rem;
      font-weight: 900;
      line-height: 1.2;
      margin-bottom: 1rem;
      letter-spacing: -1px;
    }

    .start-title span {
      background: linear-gradient(135deg, var(--accent-pink), var(--accent-violet), var(--accent-cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .start-desc {
      color: var(--text-muted);
      font-size: 1.1rem;
      margin-bottom: 2.5rem;
    }

    .round-selector {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin-bottom: 2.5rem;
    }

    .round-opt {
      padding: 0.8rem 1.8rem;
      background: rgba(15, 23, 42, 0.7);
      border: 2px solid var(--border-card);
      border-radius: 16px;
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.25 ease;
    }

    .round-opt.selected {
      border-color: var(--accent-cyan);
      background: rgba(6, 182, 212, 0.15);
      color: #fff;
      box-shadow: 0 0 20px rgba(6, 182, 212, 0.3);
    }

    .btn-start-game {
      background: linear-gradient(135deg, var(--accent-violet), var(--accent-cyan));
      color: #fff;
      font-size: 1.25rem;
      font-weight: 800;
      padding: 1.1rem 3rem;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 8px 30px rgba(139, 92, 246, 0.4);
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .btn-start-game:hover {
      transform: scale(1.05);
      box-shadow: 0 12px 40px rgba(6, 182, 212, 0.6);
    }

    /* ----------------------------------------------------
       2. MATCH SCREEN (VS CARD 1v1)
    ---------------------------------------------------- */
    .match-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 2rem;
    }

    .match-title-badge {
      font-family: 'Outfit', sans-serif;
      font-size: 1.8rem;
      font-weight: 900;
      background: linear-gradient(135deg, var(--accent-gold), var(--accent-pink));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .progress-bar-bg {
      width: 100%;
      max-width: 500px;
      height: 10px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 0.5rem;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent-violet), var(--accent-cyan));
      transition: width 0.3s ease;
    }

    .match-subtitle {
      font-size: 0.95rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    /* Match Grid */
    .vs-container {
      display: grid;
      grid-template-columns: 1fr 100px 1fr;
      gap: 1.5rem;
      align-items: center;
      margin: auto 0;
    }

    .vs-card {
      background: var(--bg-card);
      border: 2px solid var(--border-card);
      border-radius: 28px;
      overflow: hidden;
      cursor: pointer;
      transition: all 0.35s cubic-bezier(0.25, 1, 0.5, 1);
      position: relative;
      display: flex;
      flex-direction: column;
      height: 480px;
      backdrop-filter: blur(12px);
    }

    .vs-card:hover {
      transform: translateY(-8px) scale(1.02);
      border-color: var(--accent-cyan);
      box-shadow: 0 20px 40px rgba(6, 182, 212, 0.3);
    }

    .vs-card.selected {
      border-color: var(--accent-neon);
      box-shadow: 0 0 50px rgba(16, 185, 129, 0.8);
      transform: scale(1.04);
      z-index: 10;
    }

    .vs-card.unselected {
      opacity: 0.2;
      transform: scale(0.92);
      filter: blur(4px);
    }

    .vs-card-img {
      width: 100%;
      height: 330px;
      object-fit: cover;
      transition: transform 0.5s ease;
    }

    .vs-card:hover .vs-card-img {
      transform: scale(1.08);
    }

    .vs-card-body {
      padding: 1.5rem;
      background: linear-gradient(to top, rgba(15, 23, 42, 0.95), rgba(15, 23, 42, 0.7));
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      text-align: center;
    }

    .vs-card-name {
      font-size: 1.6rem;
      font-weight: 800;
      margin-bottom: 0.3rem;
      color: #fff;
    }

    .vs-card-desc {
      font-size: 0.95rem;
      color: var(--text-muted);
    }

    .vs-badge {
      width: 80px;
      height: 80px;
      background: radial-gradient(circle, #ec4899 0%, #8b5cf6 100%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Outfit', sans-serif;
      font-weight: 900;
      font-size: 1.8rem;
      color: #fff;
      margin: 0 auto;
      box-shadow: 0 0 30px rgba(236, 72, 153, 0.6);
      animation: pulseVs 1.5s infinite alternate;
      user-select: none;
    }

    @keyframes pulseVs {
      from { transform: scale(1); box-shadow: 0 0 20px rgba(236, 72, 153, 0.5); }
      to { transform: scale(1.15); box-shadow: 0 0 40px rgba(139, 92, 246, 0.9); }
    }

    /* ----------------------------------------------------
       3. WINNER / RESULTS SCREEN
    ---------------------------------------------------- */
    .results-wrapper {
      text-align: center;
      max-width: 900px;
      margin: 0 auto;
      width: 100%;
    }

    .trophy-card {
      background: linear-gradient(135deg, rgba(245, 158, 11, 0.15), rgba(139, 92, 246, 0.15));
      border: 2px solid rgba(245, 158, 11, 0.4);
      border-radius: 32px;
      padding: 3rem 2rem;
      margin-bottom: 3rem;
      backdrop-filter: blur(20px);
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
      position: relative;
    }

    .trophy-icon {
      font-size: 4.5rem;
      margin-bottom: 0.5rem;
      animation: bounceTrophy 1.2s infinite alternate ease-in-out;
    }

    @keyframes bounceTrophy {
      from { transform: translateY(0) scale(1); }
      to { transform: translateY(-12px) scale(1.1); }
    }

    .winner-img {
      width: 220px;
      height: 220px;
      border-radius: 50%;
      object-fit: cover;
      border: 6px solid var(--accent-gold);
      box-shadow: 0 0 40px rgba(245, 158, 11, 0.6);
      margin: 1rem auto;
      display: block;
    }

    .winner-title {
      font-size: 2.5rem;
      font-weight: 900;
      color: #fff;
      margin-bottom: 0.5rem;
    }

    .winner-desc {
      font-size: 1.1rem;
      color: var(--text-muted);
      max-width: 500px;
      margin: 0 auto 1.5rem;
    }

    /* Bracket Tree Section */
    .bracket-section {
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: 24px;
      padding: 2rem;
      margin-bottom: 3rem;
      text-align: left;
    }

    .bracket-title {
      font-size: 1.3rem;
      font-weight: 800;
      margin-bottom: 1.5rem;
      color: var(--accent-cyan);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .bracket-tree {
      display: flex;
      gap: 1.5rem;
      overflow-x: auto;
      padding-bottom: 1rem;
    }

    .bracket-column {
      display: flex;
      flex-direction: column;
      justify-content: space-around;
      min-width: 170px;
    }

    .bracket-round-name {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 1rem;
      text-transform: uppercase;
    }

    .bracket-match {
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid var(--border-card);
      border-radius: 12px;
      padding: 0.5rem 0.75rem;
      margin-bottom: 0.75rem;
    }

    .bracket-item {
      font-size: 0.85rem;
      padding: 0.25rem 0;
      display: flex;
      justify-content: space-between;
      color: var(--text-muted);
    }

    .bracket-item.winner {
      color: var(--accent-gold);
      font-weight: 700;
    }

    .action-group {
      display: flex;
      justify-content: center;
      gap: 1rem;
      flex-wrap: wrap;
    }

    /* Modal for Candidates */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(10px);
      z-index: 200;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-content {
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: 24px;
      max-width: 800px;
      width: 100%;
      max-height: 80vh;
      overflow-y: auto;
      padding: 2rem;
      position: relative;
    }

    .modal-title {
      font-size: 1.4rem;
      font-weight: 800;
      margin-bottom: 1.5rem;
    }

    .modal-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 1rem;
    }

    .modal-card {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--border-card);
      border-radius: 14px;
      overflow: hidden;
      text-align: center;
    }

    .modal-card img {
      width: 100%;
      height: 110px;
      object-fit: cover;
    }

    .modal-card-name {
      font-size: 0.9rem;
      font-weight: 700;
      padding: 0.5rem;
    }

    .btn-close-modal {
      position: absolute;
      top: 1.5rem;
      right: 1.5rem;
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: #fff;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1.1rem;
    }

    /* Confetti Canvas */
    #confettiCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 150;
    }

    @media (max-width: 768px) {
      .vs-container {
        grid-template-columns: 1fr;
        gap: 1rem;
      }
      .vs-badge {
        margin: -20px auto;
        z-index: 20;
        width: 60px;
        height: 60px;
        font-size: 1.3rem;
      }
      .vs-card {
        height: 300px;
      }
      .vs-card-img {
        height: 180px;
      }
      .start-title {
        font-size: 2rem;
      }
    }
  </style>
</head>
<body>

  <!-- Top Header Nav -->
  <header>
    <div class="brand">
      <span class="brand-badge">VS</span>
      <span>이상형 월드컵 GAME</span>
    </div>
    <div class="header-btns">
      <button class="btn-header" onclick="openCandidatesModal()">📋 전체 후보 보기</button>
      <button class="btn-header" id="btnAudioToggle" onclick="toggleAudio()">🔊 효과음 ON</button>
    </div>
  </header>

  <!-- Confetti Canvas -->
  <canvas id="confettiCanvas"></canvas>

  <!-- 1. START SCREEN -->
  <div id="screenStart" class="view-screen active">
    <div class="start-container">
      <div class="start-tag">K-푸드 대표 야식 토너먼트</div>
      <h1 class="start-title">출출한 밤 최애 야식 1위<br><span>이상형 월드컵 16강</span></h1>
      <p class="start-desc">치킨 vs 피자, 떡볶이 vs 족발! 가슴 뛰는 1:1 대결에서 최후의 야식을 가려보세요.</p>

      <div class="round-selector">
        <button class="round-opt selected" onclick="selectRound(16, this)">16강</button>
        <button class="round-opt" onclick="selectRound(8, this)">8강</button>
        <button class="round-opt" onclick="selectRound(4, this)">4강</button>
      </div>

      <button class="btn-start-game" onclick="startGame()">월드컵 게임 시작 🚀</button>
    </div>
  </div>

  <!-- 2. MATCH SCREEN -->
  <div id="screenMatch" class="view-screen">
    <div class="match-header">
      <div id="matchRoundBadge" class="match-title-badge">16강 (1/8)</div>
      <div class="progress-bar-bg">
        <div id="progressBarFill" class="progress-bar-fill"></div>
      </div>
      <div id="matchSubtitle" class="match-subtitle">두 야식 중 마음에 드는 하나를 클릭하세요!</div>
    </div>

    <div class="vs-container">
      <!-- Left Card -->
      <div id="cardLeft" class="vs-card" onclick="chooseCandidate(0)">
        <img id="imgLeft" class="vs-card-img" src="" alt="후보 1">
        <div class="vs-card-body">
          <div id="nameLeft" class="vs-card-name">후보 A</div>
          <div id="descLeft" class="vs-card-desc">설명 A</div>
        </div>
      </div>

      <!-- Center VS -->
      <div class="vs-badge">VS</div>

      <!-- Right Card -->
      <div id="cardRight" class="vs-card" onclick="chooseCandidate(1)">
        <img id="imgRight" class="vs-card-img" src="" alt="후보 2">
        <div class="vs-card-body">
          <div id="nameRight" class="vs-card-name">후보 B</div>
          <div id="descRight" class="vs-card-desc">설명 B</div>
        </div>
      </div>
    </div>
  </div>

  <!-- 3. RESULTS SCREEN -->
  <div id="screenResult" class="view-screen">
    <div class="results-wrapper">
      <div class="trophy-card">
        <div class="trophy-icon">🏆</div>
        <h2 class="winner-title">최종 우승 야식!</h2>
        <img id="winnerImg" class="winner-img" src="" alt="우승자">
        <h1 id="winnerName" class="winner-title" style="color: var(--accent-gold);">양념치킨</h1>
        <p id="winnerDesc" class="winner-desc">달콤 매콤 바삭한 야식의 영원한 왕좌</p>

        <div class="action-group">
          <button class="btn-start-game" style="font-size: 1rem; padding: 0.8rem 2rem;" onclick="restartGame()">🔄 다시하기 (새 대진표)</button>
          <button class="btn-header" style="font-size: 1rem; padding: 0.8rem 1.5rem;" onclick="showStartScreen()">⚙️ 라운드 변경</button>
        </div>
      </div>

      <!-- Bracket tree view -->
      <div class="bracket-section">
        <div class="bracket-title">🌳 토너먼트 진행 결과 대진표 (Bracket View)</div>
        <div id="bracketTree" class="bracket-tree">
          <!-- Dynamically populated -->
        </div>
      </div>
    </div>
  </div>

  <!-- Modal for Candidates List -->
  <div id="modalCandidates" class="modal-overlay">
    <div class="modal-content">
      <button class="btn-close-modal" onclick="closeCandidatesModal()">✕</button>
      <h3 class="modal-title">📦 전체 참가 후보 (16명)</h3>
      <div id="modalGrid" class="modal-grid">
        <!-- Rendered by JS -->
      </div>
    </div>
  </div>

  <script>
    // ----------------------------------------------------
    // DATA SOURCE
    // ----------------------------------------------------
    const CANDIDATES_DATA = [
      { id: 1, name: "양념치킨", img: "https://images.unsplash.com/photo-1626645738196-c2a7c87a8f58?w=600&auto=format&fit=crop", desc: "달콤 매콤 바삭한 야식의 영원한 왕좌" },
      { id: 2, name: "페퍼로니 피자", img: "https://images.unsplash.com/photo-1513104890138-7c749659a591?w=600&auto=format&fit=crop", desc: "고소한 치즈 풍미와 짭조름한 햄의 조화" },
      { id: 3, name: "매콤 떡볶이", img: "https://images.unsplash.com/photo-1627308595229-7830a5c91f9f?w=600&auto=format&fit=crop", desc: "쫄깃한 떡과 입맛 돋우는 소스의 국민 간식" },
      { id: 4, name: "한방 족발", img: "https://images.unsplash.com/photo-1544025162-d76694265947?w=600&auto=format&fit=crop", desc: "야들야들 쫄깃한 식감과 쌈의 미학" },
      { id: 5, name: "숯불 삼겹살", img: "https://images.unsplash.com/photo-1594041680534-e8c8cdebd659?w=600&auto=format&fit=crop", desc: "노릇노릇 불향이 솔솔 풍기는 진리의 육류" },
      { id: 6, name: "수제 햄버거", img: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=600&auto=format&fit=crop", desc: "두툼한 패티와 육즙 폭발 패스트푸드" },
      { id: 7, name: "심야 라면", img: "https://images.unsplash.com/photo-1569718212165-3a8278d5f624?w=600&auto=format&fit=crop", desc: "밤 11시에 먹는 계란 퐁당 얼큰한국물" },
      { id: 8, name: "야채 곱창볶음", img: "https://images.unsplash.com/photo-1555939594-58d7cb561ad1?w=600&auto=format&fit=crop", desc: "쫄깃한 곱창과 당면의 환상 콜라보" },
      { id: 9, name: "모둠 초밥", img: "https://images.unsplash.com/photo-1579871494447-9811cf80d66c?w=600&auto=format&fit=crop", desc: "신선함이 살아있는 고급 야식의 대표" },
      { id: 10, name: "바삭 돈까스", img: "https://images.unsplash.com/photo-1598515214211-89d3c73ae83b?w=600&auto=format&fit=crop", desc: "겉바속촉 등심 튀김의 든든한 한끼" },
      { id: 11, name: "훈제 보쌈", img: "https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=600&auto=format&fit=crop", desc: "담백한 수육과 매콤 무말랭이 김치" },
      { id: 12, name: "크림 파스타", img: "https://images.unsplash.com/photo-1621996346565-e3d5d6281288?w=600&auto=format&fit=crop", desc: "꾸덕꾸덕한 고소함이 가득한 파스타" },
      { id: 13, name: "바삭 탕수육", img: "https://images.unsplash.com/photo-1563379091339-03b21ab4a4f8?w=600&auto=format&fit=crop", desc: "부먹 vs 찍먹을 뛰어넘는 고기 튀김" },
      { id: 14, name: "알얼큰 마라탕", img: "https://images.unsplash.com/photo-1547592180-85f173990554?w=600&auto=format&fit=crop", desc: "중독성 강한 얼얼한 중식 명물" },
      { id: 15, name: "불닭발", img: "https://images.unsplash.com/photo-1562967914-608f82629710?w=600&auto=format&fit=crop", desc: "화끈한 매운맛으로 스트레스 싹 날리기" },
      { id: 16, name: "고소 곱창구이", img: "https://images.unsplash.com/photo-1544025162-d76694265947?w=600&auto=format&fit=crop", desc: "기름진 곱과 부추무침의 극상 케미" }
    ];

    // ----------------------------------------------------
    // GAME STATE
    // ----------------------------------------------------
    let totalRounds = 16;
    let currentRoundList = []; // Candidates in current round
    let nextRoundList = [];    // Winners moving to next round
    let currentMatchIndex = 0; // Index in currentRoundList (pairs: 0-1, 2-3...)
    let historyBracket = [];   // History log for Bracket View
    let soundEnabled = true;
    let isProcessingChoice = false;

    // Web Audio Synthesizer
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
    }

    function playSound(type) {
      if (!soundEnabled) return;
      initAudio();
      if (!audioCtx) return;

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      const now = audioCtx.currentTime;
      if (type === 'select') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(440, now);
        osc.frequency.exponentialRampToValueAtTime(880, now + 0.15);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
        osc.start(now);
        osc.stop(now + 0.15);
      } else if (type === 'victory') {
        const notes = [523.25, 659.25, 783.99, 1046.50];
        notes.forEach((freq, idx) => {
          const o = audioCtx.createOscillator();
          const g = audioCtx.createGain();
          o.connect(g);
          g.connect(audioCtx.destination);
          o.frequency.setValueAtTime(freq, now + idx * 0.1);
          g.gain.setValueAtTime(0.2, now + idx * 0.1);
          g.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.1 + 0.25);
          o.start(now + idx * 0.1);
          o.stop(now + idx * 0.1 + 0.25);
        });
      }
    }

    function toggleAudio() {
      soundEnabled = !soundEnabled;
      document.getElementById('btnAudioToggle').textContent = soundEnabled ? '🔊 효과음 ON' : '🔇 효과음 OFF';
    }

    // ----------------------------------------------------
    // ROUND SELECTION & START
    // ----------------------------------------------------
    function selectRound(count, btn) {
      totalRounds = count;
      document.querySelectorAll('.round-opt').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
    }

    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function showScreen(screenId) {
      document.querySelectorAll('.view-screen').forEach(s => s.classList.remove('active'));
      document.getElementById(screenId).classList.add('active');
    }

    function showStartScreen() {
      showScreen('screenStart');
    }

    function startGame() {
      // Pick subset of candidates matching round count and shuffle
      const shuffled = shuffleArray(CANDIDATES_DATA);
      currentRoundList = shuffled.slice(0, totalRounds);
      nextRoundList = [];
      currentMatchIndex = 0;
      historyBracket = [];

      showScreen('screenMatch');
      renderMatch();
    }

    function restartGame() {
      startGame();
    }

    // ----------------------------------------------------
    // MATCH LOGIC
    // ----------------------------------------------------
    function renderMatch() {
      isProcessingChoice = false;
      const left = currentRoundList[currentMatchIndex];
      const right = currentRoundList[currentMatchIndex + 1];

      // Update round title & progress bar
      const totalMatchesInRound = currentRoundList.length / 2;
      const currentMatchNum = (currentMatchIndex / 2) + 1;
      const roundName = currentRoundList.length === 2 ? '결승전 (FINAL)' : `${currentRoundList.length}강`;

      document.getElementById('matchRoundBadge').textContent = `${roundName} (${currentMatchNum}/${totalMatchesInRound})`;
      
      const overallProgress = ((totalRounds - currentRoundList.length + currentMatchIndex) / (totalRounds - 1)) * 100;
      document.getElementById('progressBarFill').style.width = `${Math.min(overallProgress, 100)}%`;

      // Cards reset class
      const cardLeft = document.getElementById('cardLeft');
      const cardRight = document.getElementById('cardRight');
      cardLeft.className = 'vs-card';
      cardRight.className = 'vs-card';

      // Left candidate
      document.getElementById('imgLeft').src = left.img;
      document.getElementById('nameLeft').textContent = left.name;
      document.getElementById('descLeft').textContent = left.desc;

      // Right candidate
      document.getElementById('imgRight').src = right.img;
      document.getElementById('nameRight').textContent = right.name;
      document.getElementById('descRight').textContent = right.desc;
    }

    function chooseCandidate(choiceIndex) {
      if (isProcessingChoice) return;
      isProcessingChoice = true;

      playSound('select');

      const cardLeft = document.getElementById('cardLeft');
      const cardRight = document.getElementById('cardRight');

      const winner = choiceIndex === 0 ? currentRoundList[currentMatchIndex] : currentRoundList[currentMatchIndex + 1];
      const loser = choiceIndex === 0 ? currentRoundList[currentMatchIndex + 1] : currentRoundList[currentMatchIndex];

      if (choiceIndex === 0) {
        cardLeft.classList.add('selected');
        cardRight.classList.add('unselected');
      } else {
        cardRight.classList.add('selected');
        cardLeft.classList.add('unselected');
      }

      // Record bracket match
      nextRoundList.push(winner);
      historyBracket.push({
        roundName: `${currentRoundList.length}강`,
        winner: winner.name,
        loser: loser.name
      });

      // Delay for card selection animation
      setTimeout(() => {
        currentMatchIndex += 2;

        // Check if round complete
        if (currentMatchIndex >= currentRoundList.length) {
          if (nextRoundList.length === 1) {
            // WE HAVE A WINNER!
            showVictory(nextRoundList[0]);
          } else {
            // Next round
            currentRoundList = nextRoundList;
            nextRoundList = [];
            currentMatchIndex = 0;
            renderMatch();
          }
        } else {
          renderMatch();
        }
      }, 500);
    }

    // ----------------------------------------------------
    // VICTORY & BRACKET VIEW
    // ----------------------------------------------------
    function showVictory(winner) {
      playSound('victory');
      showScreen('screenResult');

      document.getElementById('winnerImg').src = winner.img;
      document.getElementById('winnerName').textContent = winner.name;
      document.getElementById('winnerDesc').textContent = winner.desc;

      startConfetti();
      renderBracketTree();
    }

    function renderBracketTree() {
      const treeContainer = document.getElementById('bracketTree');
      treeContainer.innerHTML = '';

      // Group matches by roundName
      const roundGroups = {};
      historyBracket.forEach(m => {
        if (!roundGroups[m.roundName]) roundGroups[m.roundName] = [];
        roundGroups[m.roundName].push(m);
      });

      Object.keys(roundGroups).forEach(rName => {
        const col = document.createElement('div');
        col.className = 'bracket-column';

        const title = document.createElement('div');
        title.className = 'bracket-round-name';
        title.textContent = rName;
        col.appendChild(title);

        roundGroups[rName].forEach(m => {
          const matchBox = document.createElement('div');
          matchBox.className = 'bracket-match';
          matchBox.innerHTML = `
            <div class="bracket-item winner">👑 ${m.winner}</div>
            <div class="bracket-item">✕ ${m.loser}</div>
          `;
          col.appendChild(matchBox);
        });

        treeContainer.appendChild(col);
      });
    }

    // ----------------------------------------------------
    // MODAL FOR CANDIDATES
    // ----------------------------------------------------
    function openCandidatesModal() {
      const grid = document.getElementById('modalGrid');
      grid.innerHTML = '';

      CANDIDATES_DATA.forEach(c => {
        const card = document.createElement('div');
        card.className = 'modal-card';
        card.innerHTML = `
          <img src="${c.img}" alt="${c.name}">
          <div class="modal-card-name">${c.name}</div>
        `;
        grid.appendChild(card);
      });

      document.getElementById('modalCandidates').classList.add('active');
    }

    function closeCandidatesModal() {
      document.getElementById('modalCandidates').classList.remove('active');
    }

    // ----------------------------------------------------
    // CONFETTI ANIMATION (PURE JS CANVAS)
    // ----------------------------------------------------
    let confettiActive = false;
    function startConfetti() {
      const canvas = document.getElementById('confettiCanvas');
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const particles = [];
      const colors = ['#8b5cf6', '#06b6d4', '#f59e0b', '#ec4899', '#10b981'];

      for (let i = 0; i < 150; i++) {
        particles.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height - canvas.height,
          size: Math.random() * 8 + 4,
          color: colors[Math.floor(Math.random() * colors.length)],
          speedY: Math.random() * 4 + 2,
          speedX: Math.random() * 2 - 1,
          rot: Math.random() * 360,
          rotSpeed: Math.random() * 5 - 2.5
        });
      }

      confettiActive = true;
      let frameCount = 0;

      function render() {
        if (!confettiActive) return;
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        particles.forEach(p => {
          p.y += p.speedY;
          p.x += p.speedX;
          p.rot += p.rotSpeed;

          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate((p.rot * Math.PI) / 180);
          ctx.fillStyle = p.color;
          ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
          ctx.restore();

          if (p.y > canvas.height) {
            p.y = -10;
            p.x = Math.random() * canvas.width;
          }
        });

        frameCount++;
        if (frameCount < 250) {
          requestAnimationFrame(render);
        } else {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          confettiActive = false;
        }
      }

      render();
    }
  </script>
