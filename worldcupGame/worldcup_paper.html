<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>이상형 월드컵 게임 기획서 작성기</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;600;700;800&family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #090d16;
      --bg-card: rgba(22, 30, 46, 0.75);
      --border-card: rgba(255, 255, 255, 0.12);
      --accent-violet: #8b5cf6;
      --accent-cyan: #06b6d4;
      --accent-pink: #ec4899;
      --accent-emerald: #10b981;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: radial-gradient(circle at 50% -10%, #1e1b4b 0%, #090d16 70%);
      color: var(--text-main);
      min-height: 100vh;
      padding-bottom: 5rem;
    }

    /* Header */
    header {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-card);
      padding: 1.25rem 2rem;
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 1.25rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: linear-gradient(135deg, var(--accent-pink), var(--accent-violet));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header-actions {
      display: flex;
      gap: 0.75rem;
    }

    .btn {
      padding: 0.6rem 1.2rem;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }

    .btn-preset {
      background: rgba(139, 92, 246, 0.15);
      border-color: rgba(139, 92, 246, 0.3);
      color: #c084fc;
    }

    .btn-preset:hover {
      background: rgba(139, 92, 246, 0.3);
      color: #fff;
    }

    .btn-reset {
      background: rgba(239, 68, 68, 0.15);
      border-color: rgba(239, 68, 68, 0.3);
      color: #fca5a5;
    }

    .btn-reset:hover {
      background: rgba(239, 68, 68, 0.3);
      color: #fff;
    }

    .btn-download {
      background: linear-gradient(135deg, var(--accent-violet), var(--accent-cyan));
      color: #fff;
      font-weight: 700;
      box-shadow: 0 4px 15px rgba(139, 92, 246, 0.4);
    }

    .btn-download:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(6, 182, 212, 0.5);
    }

    /* Main Container */
    .container {
      max-width: 960px;
      margin: 2.5rem auto 0;
      padding: 0 1.5rem;
    }

    .page-title {
      font-size: 2rem;
      font-weight: 800;
      margin-bottom: 0.5rem;
    }

    .page-sub {
      color: var(--text-muted);
      margin-bottom: 2rem;
    }

    /* Form Card */
    .form-section {
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: 20px;
      padding: 2rem;
      margin-bottom: 2rem;
      backdrop-filter: blur(10px);
    }

    .form-section-title {
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 1.25rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--accent-cyan);
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    .form-label {
      display: block;
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: #e2e8f0;
    }

    .form-control {
      width: 100%;
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid var(--border-card);
      border-radius: 12px;
      padding: 0.75rem 1rem;
      color: #fff;
      font-size: 0.95rem;
      font-family: inherit;
      transition: border-color 0.2s ease;
    }

    .form-control:focus {
      outline: none;
      border-color: var(--accent-violet);
      box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.25);
    }

    textarea.form-control {
      resize: vertical;
      min-height: 80px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    /* Candidate Cards Grid */
    .candidates-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    }

    .candidates-count {
      font-size: 0.9rem;
      padding: 0.25rem 0.75rem;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 50px;
      color: var(--accent-cyan);
      font-weight: 700;
    }

    .candidate-card {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--border-card);
      border-radius: 16px;
      padding: 1.25rem;
      margin-bottom: 1.25rem;
      display: grid;
      grid-template-columns: 100px 1fr 40px;
      gap: 1.25rem;
      align-items: center;
      transition: border-color 0.2s ease;
    }

    .candidate-card:hover {
      border-color: rgba(139, 92, 246, 0.3);
    }

    .candidate-img-box {
      width: 100px;
      height: 100px;
      border-radius: 12px;
      overflow: hidden;
      background: #1e293b;
      position: relative;
      border: 1px solid var(--border-card);
    }

    .candidate-img-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .candidate-inputs {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .btn-remove {
      background: rgba(239, 68, 68, 0.15);
      border: none;
      color: #ef4444;
      width: 36px;
      height: 36px;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      transition: background 0.2s ease;
    }

    .btn-remove:hover {
      background: rgba(239, 68, 68, 0.3);
      color: #fff;
    }

    .btn-add-candidate {
      width: 100%;
      padding: 1rem;
      background: rgba(255, 255, 255, 0.05);
      border: 2px dashed var(--border-card);
      border-radius: 16px;
      color: var(--text-muted);
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-add-candidate:hover {
      background: rgba(139, 92, 246, 0.1);
      border-color: var(--accent-violet);
      color: var(--text-main);
    }

    /* Preset modal / selector */
    .preset-bar {
      display: flex;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }

    .chip-preset {
      padding: 0.5rem 1rem;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border-card);
      border-radius: 50px;
      font-size: 0.875rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .chip-preset:hover {
      background: var(--accent-violet);
      color: #fff;
      border-color: var(--accent-violet);
    }

    @media (max-width: 640px) {
      .candidate-card {
        grid-template-columns: 1fr;
        position: relative;
      }
      .candidate-img-box {
        width: 100%;
        height: 140px;
      }
      .btn-remove {
        position: absolute;
        top: 15px;
        right: 15px;
      }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="logo">
      <span>🏆</span> 이상형 월드컵 기획서 작성기
    </div>
    <div class="header-actions">
      <button class="btn btn-reset" onclick="resetForm()">🔄 초기화</button>

    <!-- Presets bar -->
    <div class="form-section">
      <div class="form-section-title">⚡ 빠른 예시로 채우기</div>
      <div class="preset-bar">
        <div class="chip-preset" onclick="loadPreset('food')">🍗 K-푸드 대표 야식 16강</div>
        <div class="chip-preset" onclick="loadPreset('anime')">🎬 추억의 애니 캐릭터 16강</div>
        <div class="chip-preset" onclick="loadPreset('travel')">✈️ 버킷리스트 세계 여행지 16강</div>
      </div>
    </div>

    <!-- Basic Info -->
    <div class="form-section">
      <div class="form-section-title">📌 1. 기본 정보 설정</div>
      
      <div class="form-group">
        <label class="form-label">월드컵 게임 제목</label>
        <input type="text" id="gameTitle" class="form-control" placeholder="예: K-푸드 대표 야식 월드컵 16강">
      </div>

      <div class="grid-2">
        <div class="form-group">
          <label class="form-label">토너먼트 라운드</label>
          <select id="roundCount" class="form-control" onchange="updateRoundNotice()">
            <option value="16">16강 토너먼트 (추천)</option>
            <option value="8">8강 토너먼트</option>
            <option value="4">4강 토너먼트</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">기획자 (가족 / 닉네임)</label>
          <input type="text" id="author" class="form-control" placeholder="예: 루크네 가족">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">게임 설명 및 컨셉</label>
        <textarea id="gameDesc" class="form-control" placeholder="가슴 뛰는 한국인의 최애 야식 1등을 가리는 흥미진진한 토너먼트!"></textarea>
      </div>
    </div>

    <!-- Candidates Section -->
    <div class="form-section">
      <div class="candidates-header">
        <div class="form-section-title" style="margin-bottom: 0;">🥊 2. 토너먼트 후보 등록</div>
        <div class="candidates-count">등록된 후보: <span id="candidateCount">0</span>명</div>
      </div>

      <div id="candidateList">
        <!-- Dynamic candidate cards inserted here -->
      </div>

      <button class="btn-add-candidate" onclick="addCandidate()">+ 새 후보 추가하기</button>
    </div>

    <!-- Download Section -->
    <div style="text-align: center; margin-top: 3rem;">
      <button class="btn btn-download" style="padding: 1rem 2.5rem; font-size: 1.1rem; border-radius: 50px;" onclick="downloadMarkdown()">
        📥 마크다운 기획서 파일(.md) 다운로드
      </button>
    </div>

  </div>

    // Initialize page
    window.addEventListener('DOMContentLoaded', () => {
      loadPreset('food');
    });

    function loadPreset(key) {
      const data = PRESETS[key];
      if (!data) return;

      document.getElementById('gameTitle').value = data.title;
      document.getElementById('author').value = data.author;
      document.getElementById('roundCount').value = data.round;
      document.getElementById('gameDesc').value = data.desc;

      const container = document.getElementById('candidateList');
      container.innerHTML = '';

      data.candidates.forEach((c) => {
        renderCandidateCard(c.name, c.img, c.desc);
      });

      updateCount();
    }

    function renderCandidateCard(name = '', img = '', desc = '') {
      const container = document.getElementById('candidateList');
      const card = document.createElement('div');
      card.className = 'candidate-card';

      const defaultPlaceholder = 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=600&auto=format&fit=crop';
      const imgSrc = img || defaultPlaceholder;

      card.innerHTML = `
        <div class="candidate-img-box">
          <img src="${imgSrc}" onerror="this.src='${defaultPlaceholder}'" alt="후보 이미지">
        </div>
        <div class="candidate-inputs">
          <input type="text" class="form-control c-name" placeholder="후보 이름 (예: 양념치킨)" value="${name}" oninput="updateCount()">
          <input type="text" class="form-control c-img" placeholder="이미지 URL (Unsplash 등)" value="${img}" onchange="updateImgPreview(this)">
          <input type="text" class="form-control c-desc" placeholder="한줄 설명 / 특징" value="${desc}">
        </div>
        <button class="btn-remove" onclick="removeCandidate(this)" title="후보 삭제">✕</button>
      `;

      container.appendChild(card);
      updateCount();
    }

    function addCandidate() {
      renderCandidateCard('', '', '');
    }

    function removeCandidate(btn) {
      const card = btn.closest('.candidate-card');
      if (card) {
        card.remove();
        updateCount();
      }
    }

    function updateImgPreview(input) {
      const card = input.closest('.candidate-card');
      const imgTag = card.querySelector('.candidate-img-box img');
      const url = input.value.trim();
      imgTag.src = url || 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=600&auto=format&fit=crop';
    }

    function updateCount() {
      const cards = document.querySelectorAll('.candidate-card');
      document.getElementById('candidateCount').textContent = cards.length;
    }

    function resetForm() {
      if (confirm('모든 입력 데이터를 초기화하시겠습니까?')) {
        document.getElementById('gameTitle').value = '';
        document.getElementById('author').value = '';
        document.getElementById('gameDesc').value = '';
        document.getElementById('candidateList').innerHTML = '';
        updateCount();
      }
    }

    function downloadMarkdown() {
      const title = document.getElementById('gameTitle').value.trim() || '나만의 이상형 월드컵';
      const author = document.getElementById('author').value.trim() || 'AI 바이브코더';
      const round = document.getElementById('roundCount').value;
      const desc = document.getElementById('gameDesc').value.trim() || '설명 없음';

      const cards = document.querySelectorAll('.candidate-card');
      if (cards.length < 4) {
        alert('최소 4개 이상의 후보를 추가해주세요!');
        return;
      }

      let candidatesMd = '';
      cards.forEach((card, idx) => {
        const name = card.querySelector('.c-name').value.trim() || `후보 ${idx+1}`;
        const img = card.querySelector('.c-img').value.trim() || 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=600&auto=format&fit=crop';
        const cDesc = card.querySelector('.c-desc').value.trim() || '멋진 후보입니다';

        candidatesMd += `| ${idx+1} | ${name} | ${img} | ${cDesc} |\n`;
      });

      const markdownContent = `// 게임 구현 규칙:
// 1. 전달받은 후보 리스트로 무작위 대진표(${round}강/8강/4강)를 구성한다.
// 2. 1대1 대결 화면(VS 카드)에서 후보 클릭 시 네온 이펙트와 함께 다음 라운드로 진행한다.
// 3. 우승자 결정 시 Canvas 폭죽(Confetti) 이펙트와 우승 세레머니, 전체 순위표 및 토너먼트 대진표(Bracket View)를 시각화한다.

# 이상형 월드컵 게임 기획서

## 1. 기본 정보
- **게임 제목**: ${title}
- **기획자**: ${author}
- **토너먼트 라운드**: ${round}강
- **게임 설명**: ${desc}

## 2. 후보자 목록 (${cards.length}명)

| # | 후보 이름 | 이미지 URL | 한줄 설명 |
|---|---|---|---|
${candidatesMd}
## 3. 엔딩 및 우승 연출
- **우승 메시지**: "최종 우승을 축하합니다! 당신의 최애 선택은 바로 [우승자] 입니다!"
- **세레머니 효과**: Gold Trophy 팝업 + Canvas Confetti 폭죽 이펙트
- **재도전 기능**: 새 셔플로 재경여 플레이 가능
`;

      const blob = new Blob([markdownContent], { type: 'text/markdown;charset=utf-8;' });
      const link = document.createElement('a');
      const cleanTitle = title.replace(/[/\\?%*:|"<>]/g, '_');
      link.href = URL.createObjectURL(blob);
      link.download = `월드컵_기획서_${cleanTitle}.md`;
      link.click();
      URL.revokeObjectURL(link.href);
    }
  </script>
</body>
