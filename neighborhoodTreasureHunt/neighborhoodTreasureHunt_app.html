<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>우리동네 보물찾기</title>
<style>
:root{--ink:#182334;--muted:#687588;--paper:#fffdf8;--line:#e8e0d2;--orange:#f47b45;--yellow:#ffd166;--green:#62b56f;--blue:#4d96ff;--purple:#8067d9;--danger:#df5368;--shadow:0 18px 50px rgba(47,52,62,.15)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#f5f1e9;color:var(--ink);font-family:"Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;line-height:1.55}button,input{font:inherit}.app{max-width:1180px;margin:0 auto;padding:24px 18px 46px}.topbar{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:18px}.brand{display:flex;align-items:center;gap:12px}.brand-mark{width:48px;height:48px;display:grid;place-items:center;border-radius:16px;background:#263b30;color:#fff;font-size:25px;box-shadow:0 7px 0 #17281f}.brand h1{font-size:clamp(1.3rem,3vw,2rem);margin:0;letter-spacing:-.06em}.brand p{margin:2px 0 0;color:var(--muted);font-size:.86rem}.top-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.btn{border:0;border-radius:12px;padding:10px 14px;cursor:pointer;font-weight:800;transition:.16s transform,.16s filter}.btn:hover{transform:translateY(-2px);filter:brightness(1.04)}.btn:focus-visible,.hotspot:focus-visible,.choice:focus-visible,.key:focus-visible{outline:4px solid #ffbd55;outline-offset:3px}.btn-ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}.btn-primary{background:var(--orange);color:#fff;box-shadow:0 5px 0 #c75428}.btn-dark{background:#263b30;color:#fff}.game-shell{background:var(--paper);border:1px solid var(--line);border-radius:28px;box-shadow:var(--shadow);overflow:hidden}.intro{padding:28px 30px 22px;display:flex;align-items:flex-end;justify-content:space-between;gap:20px}.intro h2{font-size:clamp(1.45rem,3vw,2.25rem);margin:0 0 6px;letter-spacing:-.07em}.intro p{margin:0;color:var(--muted)}.mission{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end}.badge{background:#f0eadf;color:#5d5143;border-radius:999px;padding:8px 12px;font-size:.82rem;font-weight:800}.badge strong{color:var(--orange)}.scene-wrap{padding:0 22px 24px}.scene{position:relative;aspect-ratio:16/8.6;min-height:420px;overflow:hidden;border-radius:22px;background:linear-gradient(#a9dcf2 0 48%,#a4cf79 48% 65%,#dfc58d 65% 72%,#545b63 72% 100%);isolation:isolate}.scene.custom-bg{background-position:center;background-size:cover;background-repeat:no-repeat}.scene.custom-bg:before{content:"";position:absolute;inset:0;background:rgba(255,255,255,.12);z-index:0}.sun{position:absolute;width:76px;height:76px;border-radius:50%;background:#ffe08a;right:8%;top:8%;box-shadow:0 0 0 14px rgba(255,224,138,.25);z-index:1}.cloud{position:absolute;color:#fff;font-size:50px;opacity:.72;z-index:1}.cloud.one{left:9%;top:8%}.cloud.two{left:35%;top:17%;font-size:38px}.hill{position:absolute;left:-4%;right:-4%;height:30%;bottom:30%;background:#7ebd79;border-radius:50% 50% 0 0/100% 100% 0 0;z-index:1}.hill.back{bottom:37%;height:22%;background:#8acb9c;opacity:.8}.road{position:absolute;left:0;right:0;bottom:0;height:30%;background:#626971;z-index:2}.road:before{content:"";position:absolute;left:0;right:0;top:49%;border-top:7px dashed #f8dc84}.sidewalk{position:absolute;left:0;right:0;bottom:29%;height:7%;background:#d7c5a2;z-index:3}.house{position:absolute;z-index:4;bottom:30%;width:19%;height:25%;border:5px solid #6d554b;border-radius:10px;background:#fff0ca;box-shadow:0 8px 0 rgba(74,60,46,.14)}.house:before{content:"";position:absolute;left:-12%;top:-42%;width:124%;height:60%;background:#d86c56;clip-path:polygon(50% 0,100% 100%,0 100%);border:4px solid #6d554b}.house:after{content:"";position:absolute;left:42%;bottom:0;width:23%;height:43%;background:#8c6d58;border:3px solid #6d554b}.house.a{left:7%;background:#ffe5b8}.house.b{left:39%;background:#d5edda}.house.c{right:7%;background:#dbe8ff}.window{position:absolute;width:24%;height:26%;background:#9bd8ef;border:3px solid #6d554b;top:31%;left:15%;box-shadow:inset 0 0 0 3px rgba(255,255,255,.5)}.window.right{left:auto;right:15%}.tree{position:absolute;z-index:5;bottom:29%;font-size:62px;filter:drop-shadow(0 6px 0 rgba(54,90,48,.2))}.tree.t1{left:28%}.tree.t2{right:29%}.sign{position:absolute;z-index:6;bottom:33%;left:50%;transform:translateX(-50%);background:#fff3c8;border:4px solid #72583c;padding:8px 18px;border-radius:10px;font-weight:900;color:#6b4d2f;box-shadow:0 5px 0 rgba(73,58,37,.2)}.hotspot{position:absolute;z-index:10;border:0;background:transparent;cursor:pointer;min-width:74px;color:var(--ink);font-weight:900;text-align:center;transform:translate(-50%,-50%);filter:drop-shadow(0 5px 2px rgba(0,0,0,.18));animation:float 2.7s ease-in-out infinite}.hotspot .icon{display:grid;place-items:center;width:58px;height:58px;margin:auto;border-radius:20px;background:#fff;border:4px solid #263b30;font-size:31px;box-shadow:0 4px 0 #263b30}.hotspot span{display:block;margin-top:6px;background:#fff;padding:4px 8px;border-radius:8px;font-size:.75rem;white-space:nowrap}.hotspot.locked{opacity:.48;filter:grayscale(.7);animation:none}.hotspot.solved .icon{background:#c9f2c8;border-color:#397847;box-shadow:0 4px 0 #397847}.hotspot.solved span:after{content:" ✓";color:#328242}.hotspot.mailbox{left:14%;top:64%;animation-delay:.1s}.hotspot.park{left:37%;top:56%;animation-delay:.3s}.hotspot.library{left:60%;top:44%;animation-delay:.55s}.hotspot.bakery{left:83%;top:52%;animation-delay:.8s}.hotspot.treasure{left:51%;top:78%;animation-delay:1s}.scene-note{position:absolute;left:14px;bottom:12px;z-index:12;background:rgba(255,255,255,.86);border-radius:10px;padding:6px 10px;color:#536071;font-size:.75rem}.status{display:grid;grid-template-columns:1.2fr 1fr;gap:16px;padding:0 22px 22px}.panel{border:1px solid var(--line);border-radius:18px;padding:16px 18px;background:#fff}.panel h3{margin:0 0 8px;font-size:1rem}.progress{height:13px;background:#eee8df;border-radius:99px;overflow:hidden;margin:10px 0 8px}.progress>div{height:100%;width:0;background:linear-gradient(90deg,var(--orange),var(--yellow));transition:.3s}.clues{display:flex;gap:8px;flex-wrap:wrap;min-height:30px}.clue{background:#fff5d7;color:#775b22;border:1px solid #f0d997;border-radius:10px;padding:6px 9px;font-size:.78rem;font-weight:800}.upload{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.upload label{display:inline-block;background:#f1ece3;border:1px solid var(--line);padding:8px 11px;border-radius:10px;cursor:pointer;font-size:.82rem;font-weight:800}.upload input{display:none}.modal{position:fixed;inset:0;background:rgba(22,29,36,.68);display:none;align-items:center;justify-content:center;padding:18px;z-index:30}.modal.open{display:flex}.dialog{width:min(560px,100%);max-height:92vh;overflow:auto;background:var(--paper);border-radius:24px;padding:26px;box-shadow:0 24px 70px rgba(0,0,0,.3);position:relative}.dialog h2{margin:0 34px 7px 0;font-size:1.55rem;letter-spacing:-.06em}.dialog p{color:#526070}.close{position:absolute;right:18px;top:16px;border:0;background:#f1ece3;width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:20px}.dialog-actions{display:flex;gap:9px;justify-content:flex-end;flex-wrap:wrap;margin-top:20px}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}.choice{border:2px solid #d9d0c3;background:#fff;border-radius:14px;padding:14px 8px;cursor:pointer;font-size:1.5rem;transition:.15s}.choice:hover{border-color:var(--orange);transform:translateY(-2px)}.choice.selected{border-color:var(--orange);background:#fff1e5}.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:16px 0}.key{border:1px solid #ded4c7;background:#fff;border-radius:12px;padding:14px;cursor:pointer;font-size:1.2rem;font-weight:900}.key:hover{background:#fff1e5}.code-display{font-size:2rem;letter-spacing:.3em;text-align:center;background:#263b30;color:#fff;border-radius:12px;padding:10px;margin:12px 0}.error{color:var(--danger)!important;font-weight:900;min-height:1.6em}.success-icon{font-size:4rem;text-align:center}.tiny{font-size:.8rem;color:var(--muted)}footer{text-align:center;color:#889080;font-size:.8rem;padding:22px 0 0}@keyframes float{0%,100%{transform:translate(-50%,-50%)}50%{transform:translate(-50%,calc(-50% - 7px))}}@media(max-width:760px){.topbar,.intro{align-items:flex-start;flex-direction:column}.top-actions{justify-content:flex-start}.mission{justify-content:flex-start}.status{grid-template-columns:1fr}.scene{min-height:430px}.house{width:25%;height:20%}.house.b{left:37%}.house.c{right:3%}.tree{font-size:48px}.hotspot .icon{width:50px;height:50px;font-size:26px}.hotspot span{font-size:.65rem}.hotspot.mailbox{left:13%}.hotspot.park{left:34%}.hotspot.library{left:61%;top:39%}.hotspot.bakery{left:85%}.hotspot.treasure{top:80%}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><div class="brand-mark">🗺️</div><div><h1>우리동네 보물찾기</h1><p>동네 곳곳의 단서를 모아 숨겨진 보물을 찾아보세요.</p></div></div>
    <div class="top-actions"><button class="btn btn-ghost" id="hintBtn">💡 현재 힌트</button><button class="btn btn-dark" id="resetBtn">↻ 처음부터</button></div>
  </header>
  <main class="game-shell">
    <section class="intro"><div><h2>오늘의 미션: 사라진 보물지도를 찾아라!</h2><p>움직이는 장소를 클릭해 단서를 모으고, 마지막 보물상자를 열어보세요.</p></div><div class="mission"><div class="badge">진행 <strong id="stepText">0 / 4</strong></div><div class="badge">난이도 <strong>가족용</strong></div></div></section>
    <section class="scene-wrap">
      <div class="scene" id="scene" aria-label="우리동네 탐색 화면">
        <div class="sun"></div><div class="cloud one">☁️</div><div class="cloud two">☁️</div><div class="hill back"></div><div class="hill"></div><div class="house a"><i class="window"></i><i class="window right"></i></div><div class="house b"><i class="window"></i><i class="window right"></i></div><div class="house c"><i class="window"></i><i class="window right"></i></div><div class="tree t1">🌳</div><div class="tree t2">🌳</div><div class="sidewalk"></div><div class="road"></div><div class="sign">우리동네</div>
        <button class="hotspot mailbox" data-place="mailbox" aria-label="우체통 조사"><span class="icon">📮</span><span>동네 우체통</span></button>
        <button class="hotspot park locked" data-place="park" aria-label="공원 조사"><span class="icon">🛝</span><span>햇살 공원</span></button>
        <button class="hotspot library locked" data-place="library" aria-label="도서관 조사"><span class="icon">📚</span><span>작은 도서관</span></button>
        <button class="hotspot bakery locked" data-place="bakery" aria-label="빵집 조사"><span class="icon">🥐</span><span>별빵집</span></button>
        <button class="hotspot treasure locked" data-place="treasure" aria-label="보물상자 조사"><span class="icon">🧰</span><span>보물상자</span></button>
        <div class="scene-note">🔎 반짝이는 장소를 차례로 눌러보세요</div>
      </div>
    </section>
    <section class="status">
      <div class="panel"><h3>🧭 탐험 지도</h3><div class="progress"><div id="progressBar"></div></div><div id="progressLabel" class="tiny">첫 단서를 찾아보세요.</div></div>
      <div class="panel"><h3>🧩 모은 단서</h3><div class="clues" id="clues"><span class="tiny">아직 단서가 없습니다.</span></div></div>
      <div class="panel"><h3>🖼️ 우리 동네 배경 바꾸기</h3><div class="upload"><label for="bgUpload">배경 이미지 올리기</label><input id="bgUpload" type="file" accept="image/*"><span id="uploadName" class="tiny">기본 그림으로 플레이 중</span></div></div>
    </section>
  </main>
  <footer>우리동네 보물찾기 · 단일 HTML 앱 · 인터넷 없이도 기본 게임을 플레이할 수 있습니다.</footer>
</div>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="dialogTitle"><div class="dialog"><button class="close" id="closeBtn" aria-label="닫기">×</button><h2 id="dialogTitle"></h2><div id="dialogBody"></div><div class="dialog-actions" id="dialogActions"></div></div></div>

<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const scene = $('#scene'), modal = $('#modal'), title = $('#dialogTitle'), body = $('#dialogBody'), actions = $('#dialogActions');
  const hotspots = [...document.querySelectorAll('.hotspot')];
  const state = { unlocked: new Set(['mailbox']), solved: new Set(), clues: [], colorIndex: 0, code: '', gameOver: false, won: false };
  const colorOrder = ['파랑','노랑','빨강'];
  const placeLabels = {mailbox:'동네 우체통',park:'햇살 공원',library:'작은 도서관',bakery:'별빵집',treasure:'보물상자'};
  function openModal(t, html, buttons=[]) { title.textContent=t; body.innerHTML=html; actions.innerHTML=''; buttons.forEach(({label,cls='btn btn-primary',fn})=>{const b=document.createElement('button');b.className=cls;b.textContent=label;b.addEventListener('click',fn);actions.appendChild(b)}); modal.classList.add('open'); }
  function closeModal(){modal.classList.remove('open');}
  function addClue(text){ if(!state.clues.includes(text)){state.clues.push(text); const el=document.createElement('span');el.className='clue';el.textContent='🔖 '+text; $('#clues').innerHTML='';$('#clues').appendChild(el);state.clues.slice(0,-1).forEach(c=>{const x=document.createElement('span');x.className='clue';x.textContent='🔖 '+c;$('#clues').appendChild(x)});} }
  function unlock(place){state.unlocked.add(place); const h=document.querySelector(`[data-place="${place}"]`);h.classList.remove('locked');}
  function solve(place){state.solved.add(place); document.querySelector(`[data-place="${place}"]`).classList.add('solved');}
  function update(){const n=state.solved.size;$('#stepText').textContent=`${n} / 4`;$('#progressBar').style.width=(n/4*100)+'%';$('#progressLabel').textContent=n===0?'첫 단서를 찾아보세요.':n<4?`단서 ${n}개를 모았습니다. 다음 장소를 찾아보세요.`:'모든 단서를 모았습니다. 보물상자를 열어보세요.';}
  function showHint(){ if(state.won){openModal('모험 완료!', '<div class="success-icon">🎉</div><p>보물찾기를 이미 완주했어요. 다시 플레이하려면 처음부터 버튼을 눌러주세요.</p>',[{label:'닫기',cls:'btn btn-dark',fn:closeModal}]);return;} let text='우체통을 먼저 조사해보세요.';if(state.solved.has('mailbox')&&!state.solved.has('park'))text='공원 미끄럼틀 아래에 색깔 단서가 있어요.';else if(state.solved.has('park')&&!state.solved.has('library'))text='도서관에서 책갈피를 찾아보세요.';else if(state.solved.has('library')&&!state.solved.has('bakery'))text='별빵집의 간판을 자세히 살펴보세요.';else if(state.solved.has('bakery'))text='이제 우리동네 한가운데의 보물상자를 열 차례예요.';openModal('현재 힌트',`<p>🔍 ${text}</p><p class="tiny">힌트는 게임의 답을 바로 알려주지 않고, 다음 장소를 찾도록 도와줍니다.</p>`,[{label:'알겠어요',fn:closeModal}]); }
  function gameOver(msg){state.gameOver=true;openModal('아쉽지만 다시 도전!',`<div class="success-icon">🫣</div><p>${msg}</p><p class="error">단서를 다시 확인하고 천천히 풀어보세요.</p>`,[{label:'다시 도전하기',cls:'btn btn-primary',fn:()=>{reset(false);closeModal();}},{label:'닫기',cls:'btn btn-ghost',fn:closeModal}]);}
  function mailbox(){solve('mailbox');unlock('park');addClue('첫 번째 단서: 공원 미끄럼틀 아래의 색깔 순서');update();openModal('우체통에서 발견한 편지',`<p>“보물은 우리동네를 가장 잘 아는 사람에게만 모습을 보여준단다.”</p><p>편지 뒤에는 이렇게 적혀 있습니다.</p><p><strong>공원 미끄럼틀 아래에서 색깔 순서를 찾아라!</strong></p>`,[{label:'공원으로 가기',fn:closeModal}]);}
  function park(){if(!state.unlocked.has('park'))return;let html='<p>미끄럼틀 아래에서 색깔 타일을 발견했습니다.</p><p><strong>파랑 → 노랑 → 빨강</strong> 순서대로 눌러야 다음 단서가 나타납니다.</p><div class="choices">';[['🔵','파랑'],['🟡','노랑'],['🔴','빨강']].forEach(([emoji,name])=>html+=`<button class="choice" data-color="${name}">${emoji}<br><span class="tiny">${name}</span></button>`);html+='</div><p id="puzzleMsg" class="error"></p>';openModal('햇살 공원 · 색깔 퍼즐',html,[{label:'닫기',cls:'btn btn-ghost',fn:closeModal}]);document.querySelectorAll('[data-color]').forEach(b=>b.addEventListener('click',()=>{const picked=b.dataset.color;if(picked!==colorOrder[state.colorIndex]){gameOver('색깔 순서가 맞지 않아요.');return;}b.classList.add('selected');state.colorIndex++;if(state.colorIndex===colorOrder.length){solve('park');unlock('library');addClue('두 번째 단서: 도서관 책갈피의 숫자 1');update();setTimeout(()=>openModal('색깔 퍼즐 성공!', '<p>타일 뒤에서 숫자 <strong>1</strong>이 적힌 책갈피가 나왔습니다.</p><p>다음 단서는 작은 도서관에 있어요.</p>',[{label:'도서관으로 가기',fn:closeModal}]),250);}}));}
  function library(){if(!state.unlocked.has('library'))return;solve('library');unlock('bakery');addClue('세 번째 단서: 별빵집 간판의 별 7개');update();openModal('작은 도서관 · 책갈피',`<p>세 번째 책을 펼치자 책갈피가 떨어졌습니다.</p><blockquote>“숫자 하나가 빵집으로 가는 길을 열어준다.”</blockquote><p>책갈피에 적힌 숫자는 <strong>1</strong>입니다.</p><p>별빵집 간판의 별 개수를 세어보세요.</p>`,[{label:'별빵집으로 가기',fn:closeModal}]);}
  function bakery(){if(!state.unlocked.has('bakery'))return;solve('bakery');unlock('treasure');addClue('최종 암호: 3 - 1 - 7');update();openModal('별빵집 · 마지막 단서',`<p>빵집 주인이 웃으며 말합니다.</p><blockquote>“우체통 옆 집의 번호 <strong>3</strong>, 책갈피의 숫자 <strong>1</strong>, 간판의 별 <strong>7</strong>을 차례로 기억해보렴.”</blockquote><p>이제 우리동네 가운데의 보물상자를 열 수 있습니다.</p>`,[{label:'보물상자로 가기',fn:closeModal}]);}
  function treasure(){if(!state.unlocked.has('treasure'))return;let entered='';openModal('보물상자 · 암호 입력',`<p>모은 단서를 순서대로 입력하세요.</p><p class="tiny">우체통 옆 집 번호 → 책갈피 → 별빵집 간판</p><div class="code-display" id="codeDisplay">＿ ＿ ＿</div><div class="keypad">${[1,2,3,4,5,6,7,8,9,'←',0,'✓'].map(k=>`<button class="key" data-key="${k}">${k}</button>`).join('')}</div><p id="codeMsg" class="error"></p>`,[{label:'닫기',cls:'btn btn-ghost',fn:closeModal}]);document.querySelectorAll('[data-key]').forEach(b=>b.addEventListener('click',()=>{const k=b.dataset.key;if(k==='←')entered=entered.slice(0,-1);else if(k==='✓'){if(entered==='317'){state.won=true;solve('treasure');update();openModal('보물찾기 성공!', '<div class="success-icon">🎉🗺️🎁</div><p><strong>축하합니다!</strong> 우리동네 곳곳의 단서를 모아 보물을 찾았습니다.</p><p>가족과 함께 동네를 천천히 관찰하면 평범한 하루도 멋진 모험이 됩니다.</p>',[{label:'닫기',cls:'btn btn-dark',fn:closeModal}]);}else{gameOver('암호가 맞지 않습니다. 모은 단서를 다시 살펴보세요.');}return;}else if(entered.length<3)entered+=k;$('#codeDisplay').textContent=entered.padEnd(3,'＿').split('').join(' ');}));}
  function handle(place){if(state.gameOver||state.won)return;if(place==='mailbox')mailbox();if(place==='park')park();if(place==='library')library();if(place==='bakery')bakery();if(place==='treasure')treasure();}
  hotspots.forEach(h=>h.addEventListener('click',()=>handle(h.dataset.place)));$('#hintBtn').addEventListener('click',showHint);$('#closeBtn').addEventListener('click',closeModal);modal.addEventListener('click',e=>{if(e.target===modal)closeModal();});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
  function reset(close=true){state.unlocked=new Set(['mailbox']);state.solved=new Set();state.clues=[];state.colorIndex=0;state.code='';state.gameOver=false;state.won=false;hotspots.forEach(h=>{h.classList.toggle('locked',h.dataset.place!=='mailbox');h.classList.remove('solved')});$('#clues').innerHTML='<span class="tiny">아직 단서가 없습니다.</span>';update();if(close)closeModal();}
  $('#resetBtn').addEventListener('click',()=>reset());$('#bgUpload').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=ev=>{scene.classList.add('custom-bg');scene.style.backgroundImage=`url("${ev.target.result}")`;$('#uploadName').textContent=file.name;};reader.readAsDataURL(file);});
  update();
})();
</script>
</body>
</html>
