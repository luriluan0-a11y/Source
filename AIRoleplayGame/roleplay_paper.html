<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 롤플레이 시뮬레이션 기획서 작성기</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;600;700;800&family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #090d16;
      --bg-card: rgba(22, 30, 49, 0.75);
      --border-card: rgba(255, 255, 255, 0.12);
      --accent-cyan: #06b6d4;
      --accent-violet: #8b5cf6;
      --accent-pink: #ec4899;
      --accent-gold: #f59e0b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: radial-gradient(circle at 50% -10%, #1e1b4b 0%, #090d16 70%);
      color: var(--text-main);
      min-height: 100vh;
      padding-bottom: 5rem;
    }

    header {
      background: rgba(9, 13, 22, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-card);
      padding: 1.25rem 2rem;
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 1.25rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-violet));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header-actions {
      display: flex;
      gap: 0.75rem;
    }

    .btn {
      padding: 0.6rem 1.2rem;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }

    .btn-reset {
      background: rgba(239, 68, 68, 0.15);
      border-color: rgba(239, 68, 68, 0.3);
      color: #fca5a5;
    }

    .btn-reset:hover {
      background: rgba(239, 68, 68, 0.3);
      color: #fff;
    }

    .btn-download {
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-violet));
      color: #fff;
      font-weight: 700;
      box-shadow: 0 4px 15px rgba(6, 182, 212, 0.4);
    }

    .btn-download:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(139, 92, 246, 0.5);
    }

    .container {
      max-width: 960px;
      margin: 2.5rem auto 0;
      padding: 0 1.5rem;
    }

    .page-title {
      font-size: 2rem;
      font-weight: 800;
      margin-bottom: 0.5rem;
    }

    .page-sub {
      color: var(--text-muted);
      margin-bottom: 2rem;
    }

    .form-section {
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: 20px;
      padding: 2rem;
      margin-bottom: 2rem;
      backdrop-filter: blur(10px);
    }

    .form-section-title {
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 1.25rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--accent-cyan);
    }

    .preset-bar {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .chip-preset {
      padding: 0.5rem 1rem;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border-card);
      border-radius: 50px;
      font-size: 0.875rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .chip-preset:hover {
      background: var(--accent-cyan);
      color: #fff;
      border-color: var(--accent-cyan);
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    .form-label {
      display: block;
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: #e2e8f0;
    }

    .form-control {
      width: 100%;
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid var(--border-card);
      border-radius: 12px;
      padding: 0.75rem 1rem;
      color: #fff;
      font-size: 0.95rem;
      font-family: inherit;
    }

    .form-control:focus {
      outline: none;
      border-color: var(--accent-cyan);
      box-shadow: 0 0 0 3px rgba(6, 182, 212, 0.25);
    }

    textarea.form-control {
      resize: vertical;
      min-height: 80px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
    }

    /* Scene Card */
    .scene-card {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--border-card);
      border-radius: 16px;
      padding: 1.5rem;
      margin-bottom: 1.25rem;
      position: relative;
    }

    .scene-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }

    .scene-tag {
      background: rgba(139, 92, 246, 0.2);
      color: #c084fc;
      padding: 0.25rem 0.75rem;
      border-radius: 50px;
      font-size: 0.85rem;
      font-weight: 700;
    }

    .btn-remove {
      background: rgba(239, 68, 68, 0.15);
      border: none;
      color: #ef4444;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
    }

    .btn-add-scene {
      width: 100%;
      padding: 1rem;
      background: rgba(255, 255, 255, 0.05);
      border: 2px dashed var(--border-card);
      border-radius: 16px;
      color: var(--text-muted);
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-add-scene:hover {
      background: rgba(6, 182, 212, 0.1);
      border-color: var(--accent-cyan);
      color: #fff;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">
      <span>🎭</span> AI 롤플레이 기획서 작성기
    </div>
    <div class="header-actions">
      <button class="btn btn-reset" onclick="resetForm()">🔄 초기화</button>
      <button class="btn btn-download" onclick="downloadMarkdown()">📥 마크다운 다운로드</button>
    </div>
  </header>

  <div class="container">
    <h1 class="page-title">롤플레이 시뮬레이션 기획서 만들기</h1>
    <p class="page-sub">주인공 역할, 대화 장면, 선택지 분기를 구성하여 나만의 기획서(.md)를 다운로드하세요.</p>

    <!-- Presets -->
    <div class="form-section">
      <div class="form-section-title">⚡ 빠른 예시 시나리오 채우기</div>
      <div class="preset-bar">
        <div class="chip-preset" onclick="loadPreset('space')">🚀 SF 우주 탐사선 "아스테리아호의 위기"</div>
        <div class="chip-preset" onclick="loadPreset('detective')">🔍 중세 추리 "국왕 독살 시도 사건"</div>
        <div class="chip-preset" onclick="loadPreset('hacker')">💻 사이버펑크 2099 백해커 미션</div>
      </div>
    </div>

    <!-- Basic Info -->
    <div class="form-section">
      <div class="form-section-title">📌 1. 시나리오 기본 정보</div>
      <div class="grid-2">
        <div class="form-group">
          <label class="form-label">게임 제목</label>
          <input type="text" id="gameTitle" class="form-control" placeholder="예: 아스테리아호의 위기">
        </div>
        <div class="form-group">
          <label class="form-label">기획자 (닉네임)</label>
          <input type="text" id="author" class="form-control" placeholder="예: 루크네 가족">
        </div>
      </div>

      <div class="grid-2">
        <div class="form-group">
          <label class="form-label">주인공 이름</label>
          <input type="text" id="heroName" class="form-control" placeholder="예: 캡틴 루카스">
        </div>
        <div class="form-group">
          <label class="form-label">주인공 역할 / 직업</label>
          <input type="text" id="heroRole" class="form-control" placeholder="예: 우주 탐사선 함장">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">세계관 및 무대 배경</label>
        <textarea id="worldDesc" class="form-control" placeholder="2150년, 외계 행성을 탐사하던 중 인공지능 메인 컴퓨터가 오작동하며 산소 밸브가 잠긴 상황"></textarea>
      </div>

      <div class="grid-2">
        <div class="form-group">
          <label class="form-label">최종 승리 목표</label>
          <input type="text" id="winGoal" class="form-control" placeholder="비상 산소 장치를 수리하고 미지의 행성에 무사 착륙하기">
        </div>
        <div class="form-group">
          <label class="form-label">실패 조건</label>
          <input type="text" id="failCondition" class="form-control" placeholder="체력(HP)이 0이 되거나 제한 선택 오답">
        </div>
      </div>
    </div>

    <!-- Initial Stats & Inventory -->
    <div class="form-section">
      <div class="form-section-title">📊 2. 초기 스탯 및 인벤토리 설정</div>
      <div class="grid-3">
        <div class="form-group">
          <label class="form-label">기본 체력 (HP)</label>
          <input type="number" id="statHp" class="form-control" value="100">
        </div>
        <div class="form-group">
          <label class="form-label">기본 에너지 (Energy)</label>
          <input type="number" id="statEnergy" class="form-control" value="80">
        </div>
        <div class="form-group">
          <label class="form-label">기본 신뢰도 / 명성</label>
          <input type="number" id="statTrust" class="form-control" value="50">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">시작 소지품 / 아이템 (쉼표 분리)</label>
        <input type="text" id="startItems" class="form-control" placeholder="만능 멀티툴, 비상 랜턴, 보안 암호키">
      </div>
    </div>

    <!-- Story Scenes Builder -->
    <div class="form-section">
      <div class="form-section-title">🎬 3. 스토리 장면 및 분기 선택지 구성</div>
      <div id="sceneList">
        <!-- Scenes rendered here -->
      </div>
      <button class="btn-add-scene" onclick="addScene()">+ 새 스토리 장면 추가하기</button>
    </div>

    <!-- Download CTA -->
    <div style="text-align: center; margin-top: 3rem;">
      <button class="btn btn-download" style="padding: 1rem 2.5rem; font-size: 1.1rem; border-radius: 50px;" onclick="downloadMarkdown()">
        📥 마크다운 기획서 파일(.md) 다운로드
      </button>
    </div>

  </div>

  <script>
    const PRESETS = {
      space: {
        title: "아스테리아호의 위기",
        author: "바이브코딩 패밀리",
        heroName: "캡틴 루카스",
        heroRole: "우주 탐사선 함장",
        worldDesc: "2150년, 미지의 행성 탐사 중 우주선 AI 오작동으로 비상 산소 경보가 발령된 극적인 상황.",
        winGoal: "AI 중앙 제어 장치를 해킹하고 보조 엔진을 가동하여 행성에 무사 착륙",
        failCondition: "체력 또는 에너지가 0이 되거나 우주선 폭발",
        hp: 100, energy: 80, trust: 60,
        items: "만능 멀티툴, 비상 산소 팩, 보안 암호 칩",
        scenes: [
          {
            id: "scene_1",
            title: "장면 1: 긴급 비상 경보",
            speaker: "AI 메인 컴퓨터 (ARI)",
            img: "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=600&auto=format&fit=crop",
            text: "경고! 주 산소 탱크 밸브에 결함이 발생했습니다. 10분 내로 수리하지 않으면 함내 산소가 고갈됩니다. 함장님, 명령을 내려주십시오.",
            opt1: "직접 기계실로 내려가 물리 밸브를 수동 조절한다. [체력 -20, 산소 고갈 방지]",
            opt1Target: "scene_2A",
            opt2: "조종석에서 AI 복구 프로토콜 암호를 해독한다. [에너지 -15, 신뢰도 +10]",
            opt2Target: "scene_2B"
          },
          {
            id: "scene_2A",
            title: "장면 2A: 기계실의 유독 가스",
            speaker: "엔지니어 로봇 (보트)",
            img: "https://images.unsplash.com/photo-1485827404703-89b55fcc595e?w=600&auto=format&fit=crop",
            text: "함장님! 파이프에서 유독 가스가 분출되고 있습니다. 멀티툴을 사용해 고전압 차단기를 내리거나 파이프를 용접해야 합니다.",
            opt1: "만능 멀티툴로 파이프를 밀봉한다. [에너지 -10, 수리 성공]",
            opt1Target: "scene_ending_success",
            opt2: "무모하게 손으로 밸브를 잠근다. [체력 -80, 위험!]",
            opt2Target: "scene_ending_fail"
          },
          {
            id: "scene_2B",
            title: "장면 2B: AI 메인 프레임 해킹",
            speaker: "보안 시스템 '아테나'",
            img: "https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?w=600&auto=format&fit=crop",
            text: "보안 암호 칩을 인식했습니다. AI 바이러스를 격리하고 시스템 우회 권한을 취득하시겠습니까?",
            opt1: "보안 암호 칩을 삽입하여 AI 코드를 초기화한다.",
            opt1Target: "scene_ending_success",
            opt2: "강제로 전원 코드를 차단한다.",
            opt2Target: "scene_ending_fail"
          }
        ]
      },
      detective: {
        title: "국왕 독살 시도 사건",
        author: "추리 마스터",
        heroName: "샬록 탐정",
        heroRole: "왕국 수석 탐정",
        worldDesc: "연회가 한창인 로열 캐슬. 국왕의 와인잔에서 희귀 독약 성분이 발견되어 왕성이 봉쇄됨.",
        winGoal: "3명의 용의자 중 진짜 범인을 지목하고 결정적 증거 제출",
        failCondition: "엉뚱한 사람을 범인으로 지목하거나 추리 실패",
        hp: 100, energy: 100, trust: 50,
        items: "돋보기, 와인 성분 분석지, 왕실 소지품 열쇠",
        scenes: [
          {
            id: "scene_1",
            title: "장면 1: 연회장의 살얼음판",
            speaker: "근위대장 에드워드",
            img: "https://images.unsplash.com/photo-1544025162-d76694265947?w=600&auto=format&fit=crop",
            text: "탐정님! 전하께서 쓰러지셨습니다. 현재 연회장에 있던 재상, 연금술사, 공작 부인 3명이 주요 용의자입니다.",
            opt1: "국왕의 와인 잔과 테이블 주변 증거를 수집한다.",
            opt1Target: "scene_2A",
            opt2: "연금술사의 소지품 가방을 바로 수색한다.",
            opt2Target: "scene_2B"
          }
        ]
      },
      hacker: {
        title: "사이버펑크 2099 백해커 미션",
        author: "네온 시티",
        heroName: "해커 제로",
        heroRole: "사이버 첩보 요원",
        worldDesc: "네온 불빛이 가득한 메가시티 2099. 거대 메가코프가 시민들의 데이터를 통제하는 미래.",
        winGoal: "기업 메인 서버를 해킹하여 비밀 문서를 유출하고 안전하게 탈출",
        failCondition: "보안 프로그램 '침투 추적기'에 의해 추적당함",
        hp: 100, energy: 90, trust: 40,
        items: "사이버 덱, 딥웹 암호키, EMP 스파이더",
        scenes: [
          {
            id: "scene_1",
            title: "장면 1: 데이터 잼 진입",
            speaker: "동료 조력자 '픽셀'",
            img: "https://images.unsplash.com/photo-1509198397868-475647b2a1e5?w=600&auto=format&fit=crop",
            text: "제로, 거대 기업 아라사카의 메인 프레임 앞이야. 1차 보안 방화벽이 내 신호를 추적하고 있어!",
            opt1: "EMP 스파이더를 투척하여 방화벽을 일시 마비시킨다.",
            opt1Target: "scene_2A",
            opt2: "사이버 덱으로 딥웹 바이패스 코드를 입력한다.",
            opt2Target: "scene_2B"
          }
        ]
      }
    };

    window.addEventListener('DOMContentLoaded', () => {
      loadPreset('space');
    });

    function loadPreset(key) {
      const p = PRESETS[key];
      if (!p) return;

      document.getElementById('gameTitle').value = p.title;
      document.getElementById('author').value = p.author;
      document.getElementById('heroName').value = p.heroName;
      document.getElementById('heroRole').value = p.heroRole;
      document.getElementById('worldDesc').value = p.worldDesc;
      document.getElementById('winGoal').value = p.winGoal;
      document.getElementById('failCondition').value = p.failCondition;
      document.getElementById('statHp').value = p.hp;
      document.getElementById('statEnergy').value = p.energy;
      document.getElementById('statTrust').value = p.trust;
      document.getElementById('startItems').value = p.items;

      const container = document.getElementById('sceneList');
      container.innerHTML = '';

      p.scenes.forEach(s => {
        renderSceneCard(s);
      });
    }

    function renderSceneCard(s = {}) {
      const container = document.getElementById('sceneList');
      const card = document.createElement('div');
      card.className = 'scene-card';

      const sId = s.id || `scene_${Date.now()}`;
      const sTitle = s.title || '새 스토리 장면';
      const sSpeaker = s.speaker || 'NPC / 안내자';
      const sImg = s.img || 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=600&auto=format&fit=crop';
      const sText = s.text || '상황 및 대화 내용';
      const opt1 = s.opt1 || '선택지 1 내용';
      const opt1Target = s.opt1Target || 'scene_next';
      const opt2 = s.opt2 || '선택지 2 내용';
      const opt2Target = s.opt2Target || 'scene_next';

      card.innerHTML = `
        <div class="scene-card-header">
          <span class="scene-tag">${sId}</span>
          <button class="btn-remove" onclick="removeScene(this)">✕</button>
        </div>
        <div class="grid-2">
          <div class="form-group">
            <label class="form-label">장면 제목</label>
            <input type="text" class="form-control s-title" value="${sTitle}">
          </div>
          <div class="form-group">
            <label class="form-label">화자 (NPC/AI)</label>
            <input type="text" class="form-control s-speaker" value="${sSpeaker}">
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">NPC 아바타 이미지 URL</label>
          <input type="text" class="form-control s-img" value="${sImg}">
        </div>
        <div class="form-group">
          <label class="form-label">스토리 및 대화 내러티브</label>
          <textarea class="form-control s-text">${sText}</textarea>
        </div>
        <div class="grid-2">
          <div class="form-group">
            <label class="form-label">선택지 1</label>
            <input type="text" class="form-control s-opt1" value="${opt1}">
            <input type="text" class="form-control s-opt1-target" placeholder="이동할 장면 ID (예: scene_2A)" value="${opt1Target}" style="margin-top: 0.4rem;">
          </div>
          <div class="form-group">
            <label class="form-label">선택지 2</label>
            <input type="text" class="form-control s-opt2" value="${opt2}">
            <input type="text" class="form-control s-opt2-target" placeholder="이동할 장면 ID (예: scene_2B)" value="${opt2Target}" style="margin-top: 0.4rem;">
          </div>
        </div>
      `;

      container.appendChild(card);
    }

    function addScene() {
      renderSceneCard({});
    }

    function removeScene(btn) {
      btn.closest('.scene-card').remove();
    }

    function resetForm() {
      if (confirm('모든 데이터를 초기화하시겠습니까?')) {
        document.getElementById('gameTitle').value = '';
        document.getElementById('sceneList').innerHTML = '';
      }
    }

    function downloadMarkdown() {
      const title = document.getElementById('gameTitle').value.trim() || '나만의 AI 롤플레이';
      const author = document.getElementById('author').value.trim() || 'AI 코더';
      const heroName = document.getElementById('heroName').value.trim() || '주인공';
      const heroRole = document.getElementById('heroRole').value.trim() || '모험가';
      const worldDesc = document.getElementById('worldDesc').value.trim() || '설명 없음';
      const winGoal = document.getElementById('winGoal').value.trim() || '미션 완수';
      const failCondition = document.getElementById('failCondition').value.trim() || '체력 0';

      const hp = document.getElementById('statHp').value;
      const energy = document.getElementById('statEnergy').value;
      const trust = document.getElementById('statTrust').value;
      const items = document.getElementById('startItems').value;

      const cards = document.querySelectorAll('.scene-card');
      let scenesMd = '';

      cards.forEach((card, idx) => {
        const tag = card.querySelector('.scene-tag').textContent;
        const sTitle = card.querySelector('.s-title').value;
        const sSpeaker = card.querySelector('.s-speaker').value;
        const sImg = card.querySelector('.s-img').value;
        const sText = card.querySelector('.s-text').value;
        const opt1 = card.querySelector('.s-opt1').value;
        const opt1Target = card.querySelector('.s-opt1-target').value;
        const opt2 = card.querySelector('.s-opt2').value;
        const opt2Target = card.querySelector('.s-opt2-target').value;

        scenesMd += `### 장면 ${idx+1}: ${sTitle} (ID: ${tag})
- **화자**: ${sSpeaker}
- **이미지**: ${sImg}
- **대화 내용**: ${sText}
- **선택지 1**: ${opt1} (이동: \`${opt1Target}\`)
- **선택지 2**: ${opt2} (이동: \`${opt2Target}\`)

`;
      });

      const mdContent = `// 게임 구현 규칙:
// 1. 스토리 장면별 대화창 UI와 플레이어 상태(체력, 에너지, 인벤토리)를 실시간 HUD로 표시해줘.
// 2. 플레이어의 선택지에 따라 스탯 변화, 아이템 획득 및 다음 장면으로 이동하도록 분기 로직을 구성해줘.
// 3. 목표 달성 시 성공 엔딩(Canvas 축하 효과), 체력 0 또는 조건 미달 시 실패 엔딩 화면을 시각화해줘.

# AI 롤플레이 시뮬레이션 게임 기획서

## 1. 기본 정보
- **게임 제목**: ${title}
- **기획자**: ${author}
- **주인공**: ${heroName} (${heroRole})
- **세계관**: ${worldDesc}
- **승리 목표**: ${winGoal}
- **실패 조건**: ${failCondition}

## 2. 초기 스탯 및 인벤토리
- **기본 체력 (HP)**: ${hp}
- **기본 에너지 (Energy)**: ${energy}
- **기본 신뢰도 (Trust)**: ${trust}
- **시작 소지품**: ${items}

## 3. 스토리 장면 및 분기 선택지

${scenesMd}
## 4. 엔딩 및 연출
- **성공 엔딩**: "임무 완수! 당신의 명착한 판단으로 미션을 성공시켰습니다!"
- **실패 엔딩**: "임무 실패... 체력이 고갈되었거나 치명적인 선택을 하였습니다."
`;

      const blob = new Blob([mdContent], { type: 'text/markdown;charset=utf-8;' });
      const link = document.createElement('a');
      const cleanTitle = title.replace(/[/\\?%*:|"<>]/g, '_');
      link.href = URL.createObjectURL(blob);
      link.download = `롤플레이_기획서_${cleanTitle}.md`;
      link.click();
      URL.revokeObjectURL(link.href);
    }
  </script>
</body>
</html>
